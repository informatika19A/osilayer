<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSI STACK — Menjelajahi Mekanisme Pengiriman Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080B1F;
  --bg-2:#0E1330;
  --surface:#141A3D;
  --surface-2:#1B2350;
  --surface-3:#232C63;
  --edge:#2E386F;
  --text:#F1F3FF;
  --text-dim:#9BA3D4;
  --text-faint:#6A73A8;
  --brand:#22D3EE;
  --brand-2:#38BDF8;
  --good:#2EC4B6;
  --bad:#FF5D73;
  --warn:#FFD400;
  --l1:#FF3B3B; --l1-soft:rgba(255,59,59,.14);
  --l2:#FF9F1C; --l2-soft:rgba(255,159,28,.14);
  --l3:#FFD400; --l3-soft:rgba(255,212,0,.14);
  --l4:#2EC4B6; --l4-soft:rgba(46,196,182,.14);
  --l5:#3A86FF; --l5-soft:rgba(58,134,255,.14);
  --l6:#8C6BFF; --l6-soft:rgba(140,107,255,.14);
  --l7:#C77DFF; --l7-soft:rgba(199,125,255,.14);
  --radius:18px;
  --radius-sm:10px;
  --shadow-deep: 0 20px 50px -15px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.35);
  --shadow-soft: 0 10px 24px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(58,134,255,.16), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(199,125,255,.12), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.01em;}
p{margin:0;}
::selection{background:var(--brand);color:#031014;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* ---------- Layout shell ---------- */
#app{max-width:980px;margin:0 auto;padding:20px 20px 90px;}
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(8,11,31,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge);
  margin:0 -20px 26px;padding:14px 20px;
}
.topbar-inner{max-width:940px;margin:0 auto;display:flex;align-items:center;gap:16px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(145deg,var(--l1),var(--l3) 35%,var(--l5) 65%,var(--l7));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 6px 14px -6px rgba(140,107,255,.6);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.brand-name{font-family:'Space Grotesk';font-weight:700;font-size:15px;line-height:1.15;}
.brand-sub{font-size:11px;color:var(--text-faint);}
.stepper{display:flex;gap:6px;margin-left:auto;overflow-x:auto;max-width:56%;}
.step-dot{
  flex:none;width:9px;height:9px;border-radius:50%;background:var(--surface-3);
  border:1px solid var(--edge);cursor:default;transition:.25s;
}
.step-dot.done{background:var(--good);border-color:var(--good);cursor:pointer;}
.step-dot.active{background:var(--brand);border-color:var(--brand);width:22px;border-radius:6px;}
.step-label-mobile{display:none;}
.stepper.locked .step-dot{cursor:not-allowed;opacity:.55;}
.topbar-btn{
  flex:none;border:1px solid var(--edge);background:var(--surface-2);color:var(--text-dim);
  font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;
  transition:.15s;
}
.topbar-btn:hover{border-color:var(--brand);color:var(--text);}
.dash-table-wrap{overflow-x:auto;border:1px solid var(--edge);border-radius:12px;}
.dash-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
.dash-table thead th{padding:10px 12px;text-align:left;color:var(--text-faint);font-size:11.5px;font-weight:700;border-bottom:1px solid var(--edge);background:var(--bg-2);position:sticky;top:0;}
.dash-table tbody td{padding:10px 12px;border-bottom:1px solid var(--edge);}
.dash-table tbody tr:last-child td{border-bottom:none;}
.dash-table tbody tr:hover{background:var(--surface-2);}
.kelas-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface-3);color:var(--brand);}
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,6,17,.72);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  animation:rise .2s ease both;
}
.modal-box{
  background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--edge);
  border-radius:16px;padding:26px;max-width:340px;width:100%;box-shadow:var(--shadow-deep);
}
.modal-box h3{font-size:18px;margin-bottom:6px;}
.modal-box input{
  width:100%;margin-top:14px;background:var(--bg-2);border:1px solid var(--edge);color:var(--text);
  padding:12px 14px;border-radius:11px;font-size:15px;letter-spacing:2px;
}
.modal-box input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(34,211,238,.15);}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

.panel{
  background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--edge);
  border-radius:var(--radius);
  padding:28px 26px;
  box-shadow:var(--shadow-deep);
  animation:rise .45s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.eyebrow{font-size:12px;color:var(--brand);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.eyebrow .line{height:1px;flex:1;background:linear-gradient(90deg,var(--edge),transparent);}
.panel h2{font-size:26px;margin-bottom:6px;}
.panel .lede{color:var(--text-dim);font-size:14.5px;max-width:640px;margin-bottom:22px;}

.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px;flex-wrap:wrap;}
.btn{
  border:1px solid var(--edge);background:var(--surface-2);color:var(--text);
  padding:12px 20px;border-radius:12px;font-weight:600;font-size:14.5px;cursor:pointer;
  transition:.18s transform,.18s box-shadow,.18s background;
}
.btn:hover{transform:translateY(-1px);background:var(--surface-3);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn-primary{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#031420;border:none;box-shadow:0 10px 22px -8px rgba(34,211,238,.55);
}
.btn-primary:hover{box-shadow:0 14px 26px -8px rgba(34,211,238,.7);}
.btn-ghost{background:transparent;border:1px solid var(--edge);}
.hint{font-size:12.5px;color:var(--text-faint);}
.hint.warn{color:var(--warn);}

/* ---------- Hero (login) ---------- */
.hero-stack{position:relative;height:150px;margin:-4px 0 18px;perspective:900px;}
.hero-chip{
  position:absolute;left:50%;height:26px;border-radius:8px;
  transform:translateX(-50%) rotateX(48deg);
  box-shadow:0 10px 18px -8px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;letter-spacing:.02em;color:#04060f;
}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:6px;}
.field{display:flex;flex-direction:column;gap:7px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12.5px;color:var(--text-dim);font-weight:600;}
.field input,.field select,.field textarea{
  background:var(--bg-2);border:1px solid var(--edge);color:var(--text);
  padding:12px 14px;border-radius:11px;font-size:14.5px;font-family:inherit;
  transition:.15s border-color,.15s box-shadow;
}
.field textarea{resize:vertical;min-height:80px;line-height:1.5;}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,211,238,.15);outline:none;
}
.field input.err,.field select.err{border-color:var(--bad);}

/* ---------- Question cards ---------- */
.q-card{
  background:var(--surface-2);border:1px solid var(--edge);border-radius:14px;
  padding:18px 18px 16px;margin-bottom:14px;
}
.q-head{display:flex;gap:10px;align-items:baseline;margin-bottom:12px;}
.q-num{
  font-family:'Space Grotesk';font-weight:700;font-size:13px;color:var(--bg);
  background:var(--brand);width:24px;height:24px;border-radius:7px;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.q-text{font-size:15px;font-weight:600;}
.q-multi-tag{font-size:10.5px;color:var(--l3);border:1px solid rgba(255,212,0,.4);padding:2px 7px;border-radius:20px;margin-left:8px;white-space:nowrap;}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt{
  display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;
  border:1px solid var(--edge);background:var(--bg-2);cursor:pointer;font-size:14px;transition:.15s;
}
.opt:hover{border-color:var(--brand-2);}
.opt.selected{border-color:var(--brand);background:rgba(34,211,238,.09);}
.opt.correct{border-color:var(--good);background:rgba(46,196,182,.13);}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,115,.13);}
.opt-mark{
  flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--edge);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px;
}
.opt.selected .opt-mark{border-color:var(--brand);background:var(--brand);color:#031420;}
.opt.correct .opt-mark{border-color:var(--good);background:var(--good);color:#031420;}
.opt.wrong .opt-mark{border-color:var(--bad);background:var(--bad);color:#031420;}
.opt-letter{font-weight:700;color:var(--text-faint);width:14px;}
.explain{margin-top:10px;font-size:13px;color:var(--text-dim);background:var(--bg-2);border-left:3px solid var(--brand);padding:9px 12px;border-radius:8px;display:none;}
.explain.show{display:block;}

.section-divider{display:flex;align-items:center;gap:12px;margin:26px 0 16px;}
.section-divider b{font-family:'Space Grotesk';font-size:13.5px;color:var(--text);white-space:nowrap;}
.section-divider .line{height:1px;flex:1;background:var(--edge);}

.score-banner{
  display:flex;align-items:center;gap:16px;background:var(--bg-2);border:1px solid var(--edge);
  border-radius:14px;padding:16px 18px;margin-top:16px;
}
.score-num{font-family:'Space Grotesk';font-size:30px;font-weight:700;color:var(--brand);}
.score-num small{font-size:14px;color:var(--text-faint);font-weight:500;}

/* ---------- Materi ---------- */
.layer-tower{display:flex;flex-direction:column-reverse;gap:8px;margin:6px 0 22px;}
.layer-row{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;
  border:1px solid var(--edge);background:var(--surface-2);cursor:pointer;
  transition:.18s transform,.18s box-shadow,.18s border-color;position:relative;overflow:hidden;
}
.layer-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--lc);}
.layer-row:hover{transform:translateX(4px);}
.layer-row.active{border-color:var(--lc);box-shadow:0 10px 22px -12px var(--lc), inset 0 0 0 1px var(--lc);transform:translateX(6px) scale(1.01);}
.layer-num{
  font-family:'Space Grotesk';font-weight:700;font-size:15px;color:var(--bg);
  background:var(--lc);width:30px;height:30px;border-radius:9px;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.layer-name-en{font-weight:700;font-size:14.5px;}
.layer-name-id{font-size:12px;color:var(--text-faint);}
.layer-check{margin-left:auto;font-size:15px;opacity:.25;transition:.2s;}
.layer-check.on{opacity:1;color:var(--good);}

.materi-detail{
  border:1px solid var(--edge);border-radius:16px;padding:22px;background:var(--bg-2);
  border-top:4px solid var(--lc);
}
.materi-detail h3{font-size:20px;margin-bottom:2px;}
.materi-detail .sub{color:var(--text-faint);font-size:13px;margin-bottom:16px;}
.materi-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
.materi-box{background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;}
.materi-box h4{font-size:12px;text-transform:none;color:var(--text-faint);font-weight:600;margin-bottom:8px;letter-spacing:.01em;}
.materi-box ul{margin:0;padding-left:18px;}
.materi-box li{margin-bottom:4px;font-size:13.8px;}
.pdu-pill{display:inline-flex;align-items:center;gap:6px;background:var(--lc);color:#04060f;font-weight:700;font-size:13px;padding:6px 14px;border-radius:20px;}
.analogy-box{margin-top:14px;background:linear-gradient(135deg,var(--l-soft),transparent);border:1px dashed var(--lc);border-radius:12px;padding:14px 16px;font-size:14px;font-style:italic;color:var(--text-dim);}

/* ---------- Simulasi ---------- */
.sim-wrap{display:flex;gap:22px;flex-wrap:wrap;}
.sim-stage{flex:1 1 260px;background:var(--bg-2);border:1px solid var(--edge);border-radius:16px;padding:18px;min-width:240px;}
.sim-progress{font-size:12px;color:var(--text-faint);margin-bottom:10px;font-family:'JetBrains Mono';}
.sim-panel-label{font-size:11px;color:var(--brand);font-weight:700;margin-bottom:10px;text-align:center;}
.stack-mini{display:flex;flex-direction:column-reverse;gap:5px;}
.stack-mini .mrow{
  padding:8px 10px;border-radius:8px;font-size:11.5px;font-weight:600;border:1px solid var(--edge);
  background:var(--surface);opacity:.4;transition:.25s;display:flex;justify-content:space-between;
}
.stack-mini .mrow.hot{opacity:1;transform:scale(1.04);box-shadow:0 8px 16px -8px rgba(0,0,0,.5);}
.sim-desc{flex:1 1 320px;background:var(--surface-2);border:1px solid var(--edge);border-radius:16px;padding:20px;min-width:260px;}
.sim-desc h4{font-size:16px;margin-bottom:8px;}
.sim-desc p{font-size:14px;color:var(--text-dim);margin-bottom:16px;}
.pdu-visual{display:flex;align-items:center;justify-content:center;min-height:120px;padding:10px;}
.pdu-core{background:#fff;color:#04060f;font-weight:700;font-size:12px;padding:14px 18px;border-radius:8px;}
.pdu-wrap{border:2px solid;border-radius:12px;padding:14px;position:relative;}
.pdu-tag{position:absolute;top:-11px;left:10px;font-size:10px;font-weight:700;color:#04060f;padding:2px 8px;border-radius:20px;}
.signal-wave{text-align:center;font-size:13px;color:var(--warn);margin-top:8px;letter-spacing:2px;}
.sim-nav{display:flex;gap:10px;justify-content:center;margin-top:16px;}

.order-wrap{margin-top:26px;background:var(--bg-2);border:1px solid var(--edge);border-radius:16px;padding:20px;}
.chip-row{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0;}
.chip{
  padding:9px 14px;border-radius:20px;border:1px solid var(--edge);background:var(--surface-2);
  font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
}
.chip:hover{border-color:var(--brand);}
.chip.picked{opacity:.3;pointer-events:none;}
.answer-slots{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:10px;background:var(--surface);border:1px dashed var(--edge);border-radius:12px;margin-bottom:12px;}
.slot{padding:8px 13px;border-radius:16px;font-size:12.5px;font-weight:700;background:var(--surface-3);border:1px solid var(--edge);}
.slot.correct{background:rgba(46,196,182,.2);border-color:var(--good);color:var(--good);}
.slot.wrong{background:rgba(255,93,115,.2);border-color:var(--bad);color:var(--bad);}

/* ---------- Kuis ---------- */
.level-tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.level-tab{
  flex:1;min-width:140px;padding:14px 16px;border-radius:14px;border:1px solid var(--edge);
  background:var(--surface-2);cursor:pointer;transition:.18s;position:relative;
}
.level-tab.locked{opacity:.4;cursor:not-allowed;}
.level-tab.active{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);}
.level-tab .lt-title{font-family:'Space Grotesk';font-weight:700;font-size:14.5px;}
.level-tab .lt-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.level-tab .lt-stars{margin-top:6px;font-size:13px;letter-spacing:2px;}

/* ---------- Refleksi ---------- */
.slider-wrap{margin:8px 0 22px;}
.slider-wrap input[type=range]{width:100%;accent-color:var(--brand);}
.slider-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-faint);margin-top:4px;}
.slider-val{text-align:center;font-family:'Space Grotesk';font-size:26px;color:var(--brand);font-weight:700;margin-bottom:4px;}
.likert-table{display:flex;flex-direction:column;gap:8px;margin:14px 0 22px;}
.likert-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg-2);border:1px solid var(--edge);border-radius:10px;flex-wrap:wrap;}
.likert-row .lname{flex:1 1 170px;font-size:13.5px;font-weight:600;min-width:150px;}
.likert-opts{display:flex;gap:6px;flex-wrap:wrap;}
.likert-btn{
  font-size:11.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--edge);
  background:var(--surface-2);cursor:pointer;color:var(--text-dim);
}
.likert-btn.on{background:var(--brand);color:#031420;border-color:var(--brand);font-weight:700;}

/* ---------- Matching ---------- */
.match-set{background:var(--bg-2);border:1px solid var(--edge);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--edge);}
.match-row:last-child{border-bottom:none;}
.match-left{font-size:13.8px;font-weight:600;}
.match-row select{width:100%;}

/* ---------- Hasil ---------- */
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:18px 0;}
.result-card{background:var(--bg-2);border:1px solid var(--edge);border-radius:14px;padding:18px;text-align:center;}
.result-card .rv{font-family:'Space Grotesk';font-size:30px;font-weight:700;}
.result-card .rl{font-size:12px;color:var(--text-faint);margin-top:4px;}
.compare-bars{margin-top:6px;}
.cbar-row{margin-bottom:14px;}
.cbar-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;}
.cbar-track{height:10px;background:var(--bg-2);border-radius:8px;overflow:hidden;}
.cbar-fill{height:100%;border-radius:8px;transition:width .8s ease;}

.badge-final{
  display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(199,125,255,.1));
  border:1px solid var(--edge);border-radius:16px;padding:20px;margin-top:20px;
}
.badge-icon{font-size:38px;}
@media print{
  .topbar,.nav-row,#simSection,#kuisSection,#loginSection,#pretestSection,#materiSection,#refleksiSection,#postestSection{display:none !important;}
  body{background:#fff;color:#000;}
}
@media (max-width:640px){
  .field-grid{grid-template-columns:1fr;}
  .materi-grid{grid-template-columns:1fr;}
  .stepper{max-width:100%;}
  .panel{padding:22px 16px;}
  .match-row{grid-template-columns:1fr;gap:4px;}
}

 ].filter(Boolean).join(" || ");
 return {

   pretestMax: S.pretestChecked ? preMax : "",

function renderStepper(){
 const el = document.getElementById("stepper");
 const locked = STEPS[S.step].id==="hasil";
 el.classList.toggle("locked",locked);
 el.innerHTML = STEPS.map((s,i)=>{
   let cls = "step-dot";
   if(i===S.step) cls+=" active";
   else if(i<=S.maxUnlocked) cls+=" done";
   return `<div class="${cls}" title="${s.label}" data-i="${i}"></div>`;
 }).join("");
 if(locked) return;
 el.querySelectorAll(".step-dot").forEach(d=>{
   d.addEventListener("click",()=>{
     const i = +d.dataset.i;
     if(i<=S.maxUnlocked){S.step=i; render();}
   });
 });
}
function goNext(){
 if(!canProceed()) return;
 const leavingId = STEPS[S.step].id;
 S.step = Math.min(S.step+1, STEPS.length-1);
 S.maxUnlocked = Math.max(S.maxUnlocked,S.step);
 window.scrollTo({top:0,behavior:"smooth"});
 if(leavingId==="login"){ saveResult(); }
 render();
}
function goBack(){
 S.step = Math.max(S.step-1,0);
 window.scrollTo({top:0,behavior:"smooth"});
 render();
}
function restartFromBeginning(){
 const keepStudent = {...S.student};
 S.pretestPG = Array(PRETEST_PG.length).fill(null);
 S.pretestKX = Array(PRETEST_KOMPLEKS.length).fill(null).map(()=>[]);
 S.pretestChecked = false;
 S.materiVisited = new Set();
 S.materiActive = 7;
 S.sim = {idx:0, orderPicked:[], orderChecked:false, orderCorrectDone:false, orderAvailable:[...ORDER_CORRECT]};
 S.sim.orderChips = shuffle([...ORDER_CORRECT]);
 S.quiz = {level:"mudah",
   mudah:{ans:Array(5).fill(null),checked:false,score:0,done:false},
   sedang:{ans:Array(5).fill(null),checked:false,score:0,done:false},
   sulit:{ans:Array(5).fill(null),checked:false,score:0,done:false}};
 S.refleksi = {confidence:50,ratings:{},t1:"",t2:"",t3:""};
 S.post = {
   pg:Array(POSTTEST_PG.length).fill(null),
   kx:Array(POSTTEST_KOMPLEKS.length).fill(null).map(()=>[]),
   match:MATCHING.map(m=>Array(m.pairs.length).fill("")),
   isian:Array(ISIAN.length).fill(""),
   checked:false,
 };
 S.student = keepStudent;
 S.step = 0;
 S.maxUnlocked = 0;
 window.scrollTo({top:0,behavior:"smooth"});
 render();
}
function canProceed(){
 switch(STEPS[S.step].id){
  case "login": return S.student.nama.trim() && S.student.nis.trim() && S.student.kelas && S.student.tanggal;
  case "pretest": return S.pretestPG.every(v=>v!==null) && S.pretestKX.every(v=>v.length>0) && S.pretestChecked;
  case "materi": return S.materiVisited.size>=7;
  case "simulasi": return S.sim.orderCorrectDone;
  case "kuis": return S.quiz.mudah.done && S.quiz.sedang.done && S.quiz.sulit.done;
  case "refleksi": return S.refleksi.t1.trim() && S.refleksi.t2.trim() && S.refleksi.t3.trim() && Object.keys(S.refleksi.ratings).length>=7;
  case "posttest": return S.post.pg.every(v=>v!==null) && S.post.kx.every(v=>v.length>0) &&
    S.post.match.every(m=>m.every(v=>v!=="")) && S.post.isian.every(v=>v.trim()!=="") && S.post.checked;
  default: return true;
 }
}

       render();
     });
   });
   return;
 }
 renderStepper();

function annotateMulti(q,selected,i,group){
 const letters=["A","B","C","D","E"];
 const sel = selected||[];
 const opts=q.opt.map((o,oi)=>{
   const isCorrect = q.a.includes(oi);
   const isSelected = sel.includes(oi);
   let cls="opt";
   if(isCorrect) cls+=" correct";
   else if(isSelected && !isCorrect) cls+=" wrong";
   const mark = isCorrect ? "✓" : (isSelected ? "✕" : "");
   return `<div class="${cls}"><div class="opt-mark">${mark}</div><div class="opt-letter">${letters[oi]}</div><div>${o}</div></div>`;
 }).join("");
 return `<div class="q-card">
   <div class="q-head"><div class="q-num">${i+1}</div><div class="q-text">${q.q}<span class="q-multi-tag">pilih ≥1 jawaban</span></div></div>
   <div class="opt-list">${opts}</div>
 </div>`;
}

function renderQuestion(group,i,q,selected,multi){
 const letters = ["A","B","C","D","E"];
 const opts = q.opt.map((o,oi)=>{
   let sel=false;
   if(multi) sel = selected && selected.includes(oi);
   else sel = selected===oi;
   return `<div class="opt ${sel?"selected":""}" data-group="${group}" data-qi="${i}" data-oi="${oi}" data-multi="${multi?1:0}">
     <div class="opt-mark">${sel?"✓":""}</div><div class="opt-letter">${letters[oi]}</div><div>${o}</div>
   </div>`;
 }).join("");
 return `<div class="q-card">
   <div class="q-head"><div class="q-num">${i+1}</div><div class="q-text">${q.q}${multi?'<span class="q-multi-tag">pilih ≥1 jawaban</span>':""}</div></div>
   <div class="opt-list">${opts}</div>
 </div>`;
}

 }
 return html;
}

   </div>`;
 }).join("");
 const allAnswered = S.post.pg.every(v=>v!==null) && S.post.kx.every(v=>v.length>0) &&
   S.post.match.every(m=>m.every(v=>v!=="")) && S.post.isian.every(v=>v.trim()!=="");
 const postScoreParts = checked ? computePosttestScore() : null;
 return `
 <div class="panel">
   <div class="eyebrow"><span>POST-TEST</span><span class="line"></span></div>
   <h2>Uji Pemahaman Akhir</h2>
   <p class="lede">Saatnya membuktikan seberapa jauh pemahamanmu berkembang setelah belajar materi OSI Layer.</p>
   <div class="section-divider"><b>Bagian A · Pilihan Ganda (15 soal)</b><div class="line"></div></div>
   ${pgHtml}
   <div class="section-divider"><b>Bagian B · Pilihan Ganda Kompleks (5 soal)</b><div class="line"></div></div>
   ${kxHtml}
   <div class="section-divider"><b>Bagian C · Menjodohkan (3 soal)</b><div class="line"></div></div>
   ${matchHtml}
   <div class="section-divider"><b>Bagian D · Isian Singkat (2 soal)</b><div class="line"></div></div>
   ${isianHtml}
   ${checked?`<div class="score-banner"><div class="score-num">${postScoreParts.score}<small>/${postScoreParts.max} (${postScoreParts.pct}%)</small></div><div>Jawabanmu sudah tersimpan dan tidak dapat diubah lagi. Lanjutkan untuk melihat ringkasan hasil belajarmu.</div></div>`:""}
   <div class="nav-row">
     <button class="btn btn-ghost" id="btn-back">← Kembali</button>
     ${checked
       ? `<button class="btn btn-primary" id="btn-next">Lanjut ke Hasil →</button>`
       : `<span class="hint">${allAnswered?"":"Jawab seluruh soal terlebih dahulu"}</span><button class="btn btn-primary" id="posttest-check" ${allAnswered?"":"disabled"}>Cek Jawaban</button>`
     }
   </div>
 </div>`;
}
function computePosttestScore(){
 const postPGKX = scorePG(POSTTEST_PG,S.post.pg) + scoreKX(POSTTEST_KOMPLEKS,S.post.kx);
 const postMatch = MATCHING.reduce((acc,m,mi)=>acc + m.pairs.filter((p,pi)=>S.post.match[mi][pi]===p[1]).length,0);
 const postMatchMax = MATCHING.reduce((a,m)=>a+m.pairs.length,0);
 const postIsian = ISIAN.reduce((acc,q,i)=>acc + (q.ok.some(k=>S.post.isian[i].toLowerCase().trim().includes(k))?1:0),0);
 const score = postPGKX + postMatch + postIsian;
 const max = POSTTEST_PG.length + POSTTEST_KOMPLEKS.length + postMatchMax + ISIAN.length;
 return {score,max,pct:Math.round(score/max*100)};
}

 ].join("\n");

function scorePG(bank,ans){return bank.reduce((acc,q,i)=>acc+(ans[i]===q.a?1:0),0);}
function scoreKX(bank,ans){return bank.reduce((acc,q,i)=>{
 const sel=[...(ans[i]||[])].sort().join(",");
 const cor=[...q.a].sort().join(",");
 return acc+(sel===cor?1:0);
},0);}

async function saveResultAsPdf(){
 const filenameBase = `hasil-osi-${sanitizeId(S.student.nis||S.student.nama)}`;
 try{
   const blob = buildResultPdfBlob();
   const filename = filenameBase+".pdf";
   if(downloadsApi){
     try{ await downloadsApi.save({filename,data:blob}); return; }catch(e){ console.warn("downloads gagal, pakai cara cadangan:",e); }
   }
   const url = URL.createObjectURL(blob);
   const a=document.createElement("a"); a.href=url; a.download=filename;
   document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
 }catch(e){
   console.warn("Gagal membuat PDF, memakai cadangan .txt:",e);
   const text = buildResultText();
   const filename = filenameBase+".txt";
   if(downloadsApi){
     try{ await downloadsApi.save({filename,data:text}); return; }catch(e2){ console.warn(e2); }
   }
   const blob = new Blob([text],{type:"text/plain;charset=utf-8"});
   const url = URL.createObjectURL(blob);
   const a=document.createElement("a"); a.href=url; a.download=filename;
   document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
 }
}
/* ---- Generator PDF mandiri (tanpa library luar) ---- */
function pdfEscape(s){ return String(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
function toPdfAscii(s){
 return String(s==null?"":s)
   .replace(/[—–]/g,"-").replace(/[""]/g,'"').replace(/['']/g,"'")
   .replace(/→/g,"->").replace(/•/g,"-").replace(/…/g,"...")
   .replace(/[^\x20-\x7E\n]/g,"");
}
function wrapPlain(text,maxChars){
 const words = String(text||"").split(/\s+/).filter(Boolean);
 if(words.length===0) return ["-"];
 const lines=[]; let cur="";
 words.forEach(w=>{
   if((cur+" "+w).trim().length>maxChars){ if(cur) lines.push(cur); cur=w; }
   else cur = (cur? cur+" ":"")+w;
 });
 if(cur) lines.push(cur);
 return lines.length?lines:["-"];
}
function buildResultPdfBlob(){
 const marginX=50, topY=790, bottomY=50, lineHeight=15, usableChars=88;
 const pageW=595.28, pageH=841.89;
 const lines=[];
 const addLine=(text,opts={})=>lines.push({text:toPdfAscii(text),size:opts.size||11,bold:!!opts.bold});
 const addWrapped=(text,opts={})=>wrapPlain(toPdfAscii(text||"-"),usableChars).forEach(l=>addLine(l,opts));

 addLine("HASIL BELAJAR - OSI LAYER",{size:16,bold:true});
 addLine("");
 addLine(`Nama    : ${S.student.nama}`);
 addLine(`NIS     : ${S.student.nis}`);
 addLine(`Kelas   : ${S.student.kelas}`);
 addLine(`Tanggal : ${S.student.tanggal}`);
 addLine("");
 const parts = computePosttestScore();
 const preScore = scorePG(PRETEST_PG,S.pretestPG) + scoreKX(PRETEST_KOMPLEKS,S.pretestKX);
 const preMax = PRETEST_PG.length + PRETEST_KOMPLEKS.length;
 const prePct = Math.round(preScore/preMax*100);
 const quizTotal = S.quiz.mudah.score + S.quiz.sedang.score + S.quiz.sulit.score;
 addLine("Ringkasan Skor",{bold:true,size:13});
 addLine(`Pre-Test   : ${preScore}/${preMax} (${prePct}%)`);
 addLine(`Kuis       : Mudah ${S.quiz.mudah.score}/5, Sedang ${S.quiz.sedang.score}/5, Sulit ${S.quiz.sulit.score}/5 (Total ${quizTotal}/15)`);
 addLine(`Post-Test  : ${parts.score}/${parts.max} (${parts.pct}%)`);
 addLine(`KKTP (80%) : ${parts.pct>=80?"Tercapai":"Belum tercapai - perlu mengulang materi"}`);
 addLine(`Keyakinan diri (refleksi): ${S.refleksi.confidence}%`);
 addLine("");
 addLine("Refleksi Pembelajaran",{bold:true,size:13});
 addLine("1) Bagian paling mudah dipahami:",{bold:true}); addWrapped(S.refleksi.t1); addLine("");
 addLine("2) Bagian membingungkan & strategi:",{bold:true}); addWrapped(S.refleksi.t2); addLine("");
 addLine("3) Target belajar berikutnya:",{bold:true}); addWrapped(S.refleksi.t3);

 const pages=[]; let cur=[]; let y=topY;
 lines.forEach(item=>{
   if(y<bottomY){ pages.push(cur); cur=[]; y=topY; }
   cur.push({...item,y});
   y -= (item.size>13? lineHeight+4 : lineHeight);
 });
 pages.push(cur);

 const streams = pages.map(pageLines=>pageLines.map(it=>{
   const font = it.bold?"/F2":"/F1";
   return `BT ${font} ${it.size} Tf ${marginX} ${it.y} Td (${pdfEscape(it.text)}) Tj ET`;
 }).join("\n"));

 const objects={};
 objects[1] = `1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`;
 objects[3] = `3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n`;
 objects[4] = `4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n`;
 let objNum=5; const pageNums=[], contentNums=[];
 streams.forEach(()=>{ pageNums.push(objNum++); contentNums.push(objNum++); });
 objects[2] = `2 0 obj\n<< /Type /Pages /Kids [${pageNums.map(n=>`${n} 0 R`).join(" ")}] /Count ${pageNums.length} >>\nendobj\n`;
 streams.forEach((content,i)=>{
   const pn=pageNums[i], cn=contentNums[i];
   objects[pn] = `${pn} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cn} 0 R >>\nendobj\n`;
   objects[cn] = `${cn} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`;
 });
 const maxObj = objNum-1;
 let pdf = "%PDF-1.4\n";
 const offsets={};
 for(let n=1;n<=maxObj;n++){ if(objects[n]){ offsets[n]=pdf.length; pdf+=objects[n]; } }
 const xrefStart = pdf.length;
 pdf += `xref\n0 ${maxObj+1}\n0000000000 65535 f \n`;
 for(let n=1;n<=maxObj;n++){ pdf += (offsets[n]!=null? String(offsets[n]).padStart(10,"0")+" 00000 n \n" : "0000000000 00000 f \n"); }
 pdf += `trailer\n<< /Size ${maxObj+1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
 return new Blob([pdf],{type:"application/pdf"});
}
function toggleMulti(arr,oi){
 const idx=arr.indexOf(oi);
 if(idx>-1) arr.splice(idx,1); else arr.push(oi);
}
function syncNext(){
 const nextBtn=document.getElementById("btn-next");
 if(nextBtn) nextBtn.disabled=!canProceed();
}

document.getElementById("dashboard-toggle").addEventListener("click",()=>{
 if(MODE==="dashboard") exitDashboard(); else requestDashboardAccess();
});
render();
